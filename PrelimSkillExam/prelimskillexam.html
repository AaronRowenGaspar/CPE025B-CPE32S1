<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey of the CENTURY</title>
</head>
<body>

    <!--Header-->
    <h1 id="title">Guitar Brands Popularity Survey</h1>
    <p id="description">Tell us what guitar brands is your favorite.</p>

    <form id="survey-form">
        
        <!--Input Fields and Validation-->
        <div>
            <label id="name-label" for="name">Name:</label>
            <input 
                type="text" 
                id="name" 
                placeholder="Enter your full name" 
                required>
        </div>

        <div>
            <label id="email-label" for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email address" 
                required>
        </div>

        <div>
            <label id="number-label" for="number">Age (Years):</label>
            <input 
                type="number" 
                id="number" 
                min="13" 
                max="120" 
                placeholder="Age">
        </div>

        <!--Selection and Submission Controls-->
        <div>
            <p>What guitar brand do you prefer?</p>
            <select id="dropdown">
                <option selected value>Select an option</option>
                <option value="gibson">Gibson</option>
                <option value="fender">Fender</option>
                <option value="ibanez">Ibanez</option>
                <option value="squire">Squire</option>
                <option value="rjguitars">RJ Guitars</option>
            </select>
        </div>

        <div>
            <p>Would you recommend this guitar brand to other people that want to buy a new one?</p>
            <label>
                <input type="radio" name="recommend" value="yes" checked> Yes
            </label>
            <label>
                <input type="radio" name="recommend" value="no"> No
            </label>
        </div>

        <div>
            <p>What is your standards in deciding your preferable brand?</p>
            <label>
                <input type="checkbox" name="topics" value="popularity"> Popularity
            </label>
            <label>
                <input type="checkbox" name="topics" value="product quality"> Product Quality
            </label>
            <label>
                <input type="checkbox" name="topics" value="price"> Price
            </label>
            <label>
                <input type="checkbox" name="topics" value="availability"> Product Availabilty
            </label>
            <label>
                <input type="checkbox" name="topics" value="sound quality"> Sound Quality
            </label>
        </div>

        <div>
            <p>Supplementary Comments:</p>
            <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>
        </div>

        <button type="submit" id="submit">Submit</button>

        <style>
            #title {
                font-family:Verdana, Geneva, Tahoma, sans-serif;
                text-align: center;
            }

            #description {
                font-family:Verdana, Geneva, Tahoma, sans-serif;
                text-align: center;
            }

            body {
                background-color: lightblue;
            }

            #name {
                width: 35%;
            }

            #email {
                width: 35%;
            }
        </style>
</body>
</html>
